name: Build firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/build.yml"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library"

      - name: Compile
        run: |
          arduino-cli compile \
            -b "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc" \
            --export-binaries firmware/esp32_keystroke_typer

      - name: Collect binaries
        run: |
          mkdir out
          cp firmware/esp32_keystroke_typer/build/esp32.esp32.esp32s3/*.ino.merged.bin out/esp32_typer_FULL_flash_at_0x0.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*.bin

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
